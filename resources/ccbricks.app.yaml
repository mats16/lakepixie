resources:
  apps:
    ccbricks_app:
      name: ccbricks-${bundle.target}
      description: Claude Code on Databricks
      source_code_path: ../
      compute_size: LARGE
      resources:
        - name: lakebase
          postgres:
            branch: ${resources.postgres_projects.ccbricks_db.id}/branches/production
            database: ${resources.postgres_projects.ccbricks_db.id}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      user_api_scopes:
        - sql
        - genie
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
        - catalog.connections
        - files
        - ai-gateway
        - vector-search
        - dashboards.genie
        - mcp.external
        - mcp.functions
        - mcp.genie
        - mcp.vectorsearch
        - workspace.workspace
        - apps
      permissions:
        - level: CAN_USE
          group_name: users

